# Manager supervises on reports or after five silent ticks per worker.
# Varied puzzles with 2–4 workers and active report-backed supervision.
experiment: exploration_varied_manager_v5
room_source: exploration
exploration_version: 2
torch_affordance: explicit_station
num_rooms: 3
seeds: [42, 57, 91]
split: all
conditions: [self_play]
both_seats: false
repeats: 1
observation_version: v3
action_interface: tools
team_mode: orchestrated
min_subagents: 2
max_subagents: 4
worker_broadcast: false
orchestrator_context_version: v5
orchestrator_check_in_interval: 5
orchestrator_max_output_tokens: 2048
orchestrator_observe_team_chat: false
orchestrator_history_turns: 1
worker_history_turns: 3
worker_progress_memory: true
progress: true
mode: collaborative
communication_modes: [enabled]
model: gpt-5.4-mini
temperature: 0.2
max_output_tokens: 1024
budget:
  max_calls: 1200
  max_tokens: 6000000
