# One bounded live integration check; preview by default, --execute calls Azure.
experiment: orchestrated_live_smoke
room_source: connected
num_rooms: 3
seeds: [42]
split: all
conditions: [self_play]
both_seats: false
repeats: 1
observation_version: v3
action_interface: tools
team_mode: orchestrated
min_subagents: 1  # Historical roster range; new v4 configs use 2–4 workers.
max_subagents: 3
orchestrator_max_output_tokens: 1024
mode: collaborative
communication_modes: [enabled]
model: gpt-5.4-mini
temperature: 0.2
max_output_tokens: 1024
budget:
  max_calls: 120
  max_tokens: 1000000
