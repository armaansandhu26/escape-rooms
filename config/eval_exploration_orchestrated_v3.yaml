# Same puzzle and batch caps; persistent report-backed board and own-action memory.
experiment: exploration_orchestrator_progress_v3
room_source: exploration
exploration_version: 1
num_rooms: 3
seeds: [42]
split: all
conditions: [self_play]
both_seats: false
repeats: 1
observation_version: v3
action_interface: tools
team_mode: orchestrated
min_subagents: 1  # Historical roster range; new v4 configs use 2–4 workers.
max_subagents: 3
worker_broadcast: false
orchestrator_max_output_tokens: 2048
orchestrator_context_version: v3
orchestrator_observe_team_chat: false
# The task board persists beyond the shorter controller conversation window.
orchestrator_history_turns: 1
worker_history_turns: 3
worker_progress_memory: true
progress: true
mode: collaborative
communication_modes: [enabled]
model: gpt-5.4-mini
temperature: 0.2
max_output_tokens: 1024
budget:
  max_calls: 240
  max_tokens: 1000000
