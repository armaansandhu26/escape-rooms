# One fresh seeded map per variant. Modes/communication conditions reuse the
# same map for a fair comparison. Increase episodes or specify an explicit seeds list.
experiment: connected_rooms_pilot
room_source: connected
num_rooms: 3
episodes: 3
seed: 0
split: all
conditions: [self_play]
both_seats: false
repeats: 1
observation_version: v3
action_interface: tools
team_mode: orchestrated
min_subagents: 1  # Historical roster range; new v4 configs use 2–4 workers.
max_subagents: 8
orchestrator_max_output_tokens: 1024
mode: collaborative
communication_modes: [enabled]
model: gpt-5.4-mini
temperature: 0.2
max_output_tokens: 300
budget:
  max_calls: 400
  max_tokens: 2000000
