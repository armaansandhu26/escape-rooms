[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motiverooms"
version = "0.1.0"
description = "Text escape rooms for studying cooperation between language-model agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
azure = [
    "openai>=1.106",
]

[tool.setuptools.packages.find]
include = ["motiverooms*"]

[tool.setuptools.package-data]
motiverooms = ["static/*"]

[tool.setuptools.data-files]
"rooms/templates" = ["rooms/templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.vercel]
entrypoint = "api.index:app"
