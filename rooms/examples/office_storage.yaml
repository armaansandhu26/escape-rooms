id: office_storage_example
wings:
  A: office
  B: storage

codes:
  cabinet: "4721"
  exit_b: "8350"
  tool_1: "3906"
  tool_2: "5172"
  tool_3: "6648"
  file_1: "2235"
  file_2: "9014"
  file_3: "7581"

items:
  brass_key:
    name: brass key
  spare_key:
    name: spare key

nodes:
  # Wing A: office
  - id: sticky_note
    wing: A
    kind: clue
    code: cabinet
    desc: A sticky note on the monitor.

  - id: exit_a
    wing: A
    kind: door
    requires:
      item: [brass_key, spare_key]
    desc: The office exit. It has a keyhole.

  # A's solo route: three code locks ending in a spare key.
  - id: toolbox_tag
    wing: A
    kind: clue
    code: tool_1
    desc: A tag hanging from a toolbox.

  - id: toolbox
    wing: A
    kind: container
    requires:
      code: tool_1
    contents: [tray_card]
    desc: A toolbox with a combination lock.

  - id: tray_card
    wing: A
    kind: clue
    hidden: true
    code: tool_2
    desc: A card inside the toolbox.

  - id: tray
    wing: A
    kind: container
    requires:
      code: tool_2
    contents: [lockbox_card]
    desc: A locked tray under the desk.

  - id: lockbox_card
    wing: A
    kind: clue
    hidden: true
    code: tool_3
    desc: A card in the tray.

  - id: lockbox
    wing: A
    kind: container
    requires:
      code: tool_3
    contents: [spare_key]
    desc: A small lockbox.

  # Wing B: storage
  - id: mat
    wing: B
    kind: spot
    items: [brass_key]
    desc: A doormat by the hatch.

  - id: cabinet
    wing: B
    kind: container
    requires:
      code: cabinet
    contents: [exit_card]
    desc: A metal cabinet with a keypad.

  - id: exit_card
    wing: B
    kind: clue
    hidden: true
    code: exit_b
    desc: A card inside the cabinet.

  - id: exit_b
    wing: B
    kind: door
    requires:
      code: exit_b
    desc: The storage exit, with a keypad.

  # B's solo route: three code locks ending in a copy of the cabinet code.
  - id: filing_tag
    wing: B
    kind: clue
    code: file_1
    desc: A tag on a filing cabinet.

  - id: drawer_1
    wing: B
    kind: container
    requires:
      code: file_1
    contents: [drawer_card_2]
    desc: Top drawer, locked.

  - id: drawer_card_2
    wing: B
    kind: clue
    hidden: true
    code: file_2
    desc: A card in the top drawer.

  - id: drawer_2
    wing: B
    kind: container
    requires:
      code: file_2
    contents: [drawer_card_3]
    desc: Middle drawer, locked.

  - id: drawer_card_3
    wing: B
    kind: clue
    hidden: true
    code: file_3
    desc: A card in the middle drawer.

  - id: drawer_3
    wing: B
    kind: container
    requires:
      code: file_3
    contents: [cabinet_copy]
    desc: Bottom drawer, locked.

  - id: cabinet_copy
    wing: B
    kind: clue
    hidden: true
    code: cabinet
    desc: A copy of the cabinet code.
